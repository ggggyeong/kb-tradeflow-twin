[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kb-tradeflow-twin"
version = "1.0.0"
description = "Explainable trade-finance portfolio: OCR, conflict rules, ChromaDB RAG, PDF report"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chromadb>=1,<2",
  "fastapi>=0.116,<1",
  "langgraph>=1.1,<2",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "sentence-transformers>=5,<6",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ocr = [
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
]
dev = [
  "httpx>=0.28,<1",
  "langgraph-cli[inmem]>=0.4,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
exclude = ["data/"]
