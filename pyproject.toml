[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kb-tradeflow-twin"
version = "16.0.0"
description = "KB TradeFlow Twin - live trade-finance multi-agent workflows with native tool calling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=1.3,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langsmith>=0.5,<1",
  "matplotlib>=3.10,<4",
  "openai>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.50,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
  "types-reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
  "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
exclude = ["data/"]
